name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bake log sync credentials into the build
        env:
          LOG_SYNC_USER: ${{ secrets.LOG_SYNC_USER }}
          LOG_SYNC_PASS: ${{ secrets.LOG_SYNC_PASS }}
          LOG_SYNC_URL: ${{ secrets.LOG_SYNC_URL }}
        run: |
          if [ -n "$LOG_SYNC_PASS" ]; then
            cat > packages/server/src/baked_config.ts <<EOF
          // Generated by the release workflow; real values live only in CI secrets.
          export const BAKED_LOG_SYNC: { user: string; pass: string; url: string } | null = {
            user: "$LOG_SYNC_USER",
            pass: "$LOG_SYNC_PASS",
            url: "$LOG_SYNC_URL",
          };
          EOF
            echo "Baked log sync credentials for $LOG_SYNC_USER"
          else
            echo "No LOG_SYNC_PASS secret; shipping without baked credentials"
          fi

      - name: Build Windows exe (embeds UI bundle)
        run: bun run exe:build

      - name: Version the exe (auto-updater downloads by versioned name)
        run: mv audience-display.exe "audience-display-${GITHUB_REF_NAME#v}.exe"

      - name: Create GitHub release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: audience-display-*.exe
          generate_release_notes: true
